[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caprisec-wirepilot"
version = "1.0.0rc1"
description = "Evidence-first network investigation MCP for Project LEON"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp==1.30.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
wirepilot = "wirepilot.server:main"
wirepilot-smoke = "wirepilot.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
